services:
  sipchecker:
    build: ./srcs
    image: sipchecker:local
    container_name: sipchecker
    restart: unless-stopped
    env_file: ./srcs/.env
    environment:
      TZ: UTC
    ports:
      # Caddy relaie https://picsou06.fr/slack/... vers ce port
      - "127.0.0.1:3851:3851"
    networks: [db]
    healthcheck:
      # serveur HTTP local + token accepté par Slack (auth.test) ; toutes les 2 min pour limiter les appels à Slack
      test: ["CMD", "node", "healthcheck.js"]
      interval: 120s
      timeout: 20s
      retries: 3
      start_period: 30s

networks:
  db:
    external: true
